- version: 2
  id: museum_kb_6
  learning: "KB 6 \u2014 Artifact Exhibition Compatibility (AEC)\n\nKB item (verbatim\
    \ from museum_kb.jsonl):\nid: 6\nknowledge: Artifact Exhibition Compatibility\
    \ (AEC)\ndescription: Determines how compatible an artifact is with its current\
    \ showcase environment.\ndefinition: AEC = 10 - |ERF - SESR|, \\text{where a score\
    \ closer to 10 indicates better\n  compatibility}\ntype: calculation_knowledge\n\
    children_knowledge:\n- 2\n- 5\n\n--- setup-encode: deferred ---\nambiguous because:\
    \ CASE A scoring component of parent KB 35 (ESQ), but operationalisation is ambiguous:\
    \ ERF lives on sensitivitydata (per-artifact) while SESR lives on environmentalreadingscore\
    \ (per-reading, many per showcase over time). There is no declared join path from\
    \ any artifact-side host (sensitivitydata / usagerecords / artifactscore) to environmentalreadingscore,\
    \ and the KB does not specify which SESR reading represents the artifact's 'current\
    \ showcase environment' (latest reading? average over a window? a specific reading\
    \ id?). Encoding row-level here would require inventing a join and picking a reduction\
    \ policy.\nclarify:\n  - What is the intended grain of AEC \u2014 one value per\
    \ artifact, per (artifact, showcase) placement (usagerecords row), or per environmental\
    \ reading?\n  - Which SESR value should be used for an artifact's 'current showcase\
    \ environment': the latest reading on the artifact's current showcase, an average\
    \ over a time window (e.g. last 24h / 7d / 30d), or some other reduction?\n  -\
    \ Should we register a new join from usagerecords (or showcases) to environmentalreadingscore\
    \ via showcaseref, or compute AEC inside a query-backed model that aggregates\
    \ SESR per showcase first?\n  - If an artifact's showcase has no environmental\
    \ readings (NULL SESR) or NULL ERF, should AEC be NULL or treated as 0/10 by convention?"
  entities:
  - museum
  - memory:museum_kb_2
  - memory:museum_kb_5
  query: null
  created_at: '1970-01-01T00:00:00Z'
- version: 2
  id: museum_kb_7
  learning: "KB 7 \u2014 Material Deterioration Rate (MDR)\n\nKB item (verbatim from\
    \ museum_kb.jsonl):\nid: 7\nknowledge: Material Deterioration Rate (MDR)\ndescription:\
    \ Estimates the rate of material deterioration based on environmental factors.\n\
    definition: MDR = \\frac{ArtAgeYears \\times ERF \\times (RelHumidity - 50)^2\
    \ \\times\n  TempC}{100000}, \\text{where higher values indicate faster deterioration}\n\
    type: calculation_knowledge\nchildren_knowledge:\n- 2\n\n--- setup-encode: deferred\
    \ ---\nambiguous because: CASE A applies (parents KB 14/31/37 reference MDR as\
    \ a component score), but the MDR formula mixes columns from three tables at different\
    \ grains \u2014 ArtAgeYears (artifactscore, per-artifact), ERF (sensitivitydata,\
    \ per-artifact), RelHumidity and TempC (environmentalreadingscore, per environmental\
    \ reading taken on a showcase). The KB does not specify the grain of MDR nor how\
    \ to bridge per-reading env data to per-artifact rows. The parent KBs read like\
    \ artifact-level scores, but no aggregation policy (latest reading? mean over\
    \ a window? specific time range?) is pinned, and there is no declared join from\
    \ artifactscore/sensitivitydata to environmentalreadingscore \u2014 the only candidate\
    \ bridge is usagerecords -> showcases -> environmentalreadingscore, which itself\
    \ requires choosing a many-to-one reduction. No guess is safe.\nclarify:\n  -\
    \ What is the grain of MDR \u2014 one value per artifact, one value per environmental\
    \ reading, or one per artifact x reading pair?\n  - If per-artifact: which environmental\
    \ reading(s) supply RelHumidity and TempC for an artifact \u2014 the most recent\
    \ reading from the artifact's showcase (via usagerecords.showcaserefused -> environmentalreadingscore.showcaseref),\
    \ the average over all readings, or readings within a specific time window?\n\
    \  - Should MDR use the artifact's currently-displayed showcase (usagerecords\
    \ with displayrotatesched='Active'), or any showcase the artifact has ever been\
    \ linked to?\n  - If per-reading: how is ArtAgeYears/ERF chosen when a showcase\
    \ displays multiple artifacts simultaneously \u2014 pick one artifact, average,\
    \ or expand to artifact x reading rows?\n  - Should a new ModelJoin be registered\
    \ to bridge sensitivitydata/artifactscore to environmentalreadingscore via usagerecords\
    \ + showcases, or via some other path?"
  entities:
  - museum
  - memory:museum_kb_2
  query: null
  created_at: '1970-01-01T00:00:00Z'
- version: 2
  id: museum_kb_8
  learning: "KB 8 \u2014 Light Exposure Risk (LER)\n\nKB item (verbatim from museum_kb.jsonl):\n\
    id: 8\nknowledge: Light Exposure Risk (LER)\ndescription: Quantifies the risk\
    \ from light exposure based on artifact sensitivity\n  and current light levels.\n\
    definition: LER = \\frac{LightLux \\times LightSensWeight \\times VisibleExpLxh}{1000},\n\
    \  \\text{where LightSensWeight uses Sensitivity Weight Values}\ntype: calculation_knowledge\n\
    children_knowledge:\n- 1\n\n--- setup-encode: deferred ---\nambiguous because:\
    \ LER = (LightLux \xD7 LightSensWeight \xD7 VisibleExpLxh) / 1000 combines columns\
    \ from three tables (lightandradiationreadings.lightlux + visibleexplxh, sensitivitydata.light_sens_weight)\
    \ at incompatible grains. LightLux/VisibleExpLxh are per-light-reading (951 rows\
    \ on lightandradiationreadings, joined via env reading to a showcase), while LightSensWeight\
    \ is per-artifact on sensitivitydata. The KB does not specify which light reading\
    \ to pair with which artifact, and no declared schema join connects sensitivitydata\
    \ or artifactscore to a specific light reading (conditionassessments has both\
    \ artrefexamined and lightreadrefobserved but lacks a declared join to sensitivitydata).\
    \ Parent KBs (TETL=31, ERPS=38, rotation candidate=15) treat LER as artifact-scoped,\
    \ but the schema offers no single canonical light reading per artifact. CASE A\
    \ (this KB owns its own score Column), but operationalisation of the artifact\u2194\
    light-reading binding is not pinned \u2014 defer rather than guess.\nclarify:\n\
    \  - At what grain should LER be computed: per (artifact \xD7 light reading) row\
    \ on conditionassessments, per artifact (aggregating LightLux/VisibleExpLxh \u2014\
    \ and if so, with which aggregation: latest reading, mean, max?), or per light\
    \ reading (ignoring artifact-specific LightSensWeight and substituting a default)?\n\
    \  - If artifact-scoped: which join path should resolve a single LightLux/VisibleExpLxh\
    \ per artifact \u2014 via conditionassessments.lightreadrefobserved (most recent\
    \ assessment? all?), or via usagerecords.showcaserefused \u2192 showcases \u2192\
    \ environmentalreadingscore \u2192 lightandradiationreadings (which yields many\
    \ readings per artifact)?\n  - Should an undeclared ModelJoin be added from conditionassessments.artrefexamined\
    \ \u2192 sensitivitydata.artref so that LER can live on conditionassessments at\
    \ per-assessment grain?\n  - When LightSensWeight is NULL (artifact's lightsensitivity\
    \ not in {Low,Medium,High}), should LER be NULL (propagate unknown) or 0 (treat\
    \ unknown as no sensitivity)?"
  entities:
  - museum
  - memory:museum_kb_1
  query: null
