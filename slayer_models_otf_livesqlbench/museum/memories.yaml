- version: 2
  id: museum_kb_9
  learning: "KB 9 \u2014 Conservation Budget Efficiency (CBE)\n\nKB item (verbatim\
    \ from museum_kb.jsonl):\nid: 9\nknowledge: Conservation Budget Efficiency (CBE)\n\
    description: Measures the efficiency of conservation budget allocation relative\
    \ to\n  artifact importance.\ndefinition: CBE = \\frac{\\sum_{i \\in artifacts}\
    \ (CPI_i \\times BudgetRatio_i)}{|artifacts|},\n  \\text{where BudgetRatio is\
    \ the proportion of total conservation budget allocated\n  to each artifact}\n\
    type: calculation_knowledge\nchildren_knowledge:\n- 0\n\n--- setup-encode: deferred\
    \ ---\nambiguous because: CASE A applies (parent KB 36 combines CBE with CBR,\
    \ and KB 17 thresholds CBE<0.5, so CBE owns its own scoring entity). However,\
    \ the formula requires a numeric per-artifact conservation budget allocation and\
    \ a total conservation budget to compute BudgetRatio_i. The museum schema carries\
    \ no numeric conservation budget column \u2014 only categorical status fields\
    \ (conservationandmaintenance.budgetallocstatus in {'Adequate','Insufficient','Review\
    \ Required'} and conservationandmaintenance.maintbudgetstatus in {'Available','Limited','Depleted'}).\
    \ Mapping these labels to dollar amounts cannot be guessed.\nclarify:\n  - Which\
    \ column should be used as the numeric per-artifact conservation budget? The schema\
    \ has no dollar-amount conservation budget field \u2014 only categorical statuses\
    \ (conservationandmaintenance.budgetallocstatus: 'Adequate'/'Insufficient'/'Review\
    \ Required'; conservationandmaintenance.maintbudgetstatus: 'Available'/'Limited'/'Depleted').\
    \ Should one of these be mapped to a numeric weight (and if so, what mapping)?\n\
    \  - If budgetallocstatus is the intended source, what numeric weights should\
    \ map each label (e.g., Adequate=?, Insufficient=?, Review Required=?) so BudgetRatio_i\
    \ = weight_i / SUM(weight)?\n  - Should artifactsecurityaccess.insvalueusd (insured\
    \ value in USD) serve as a proxy for the conservation budget allocation instead?\
    \ It is the only per-artifact monetary field present.\n  - What is the grain of\
    \ 'artifacts' in the denominator |artifacts| \u2014 the count of all artifacts\
    \ in artifactscore, or only those with a conservationandmaintenance record? An\
    \ artifact may have multiple conservationandmaintenance rows (per hall) \u2014\
    \ should the budget be summed per artifact first?\n  - How should the aggregate\
    \ \u03A3(CPI_i \xD7 BudgetRatio_i)/|artifacts| be exposed \u2014 as a single scalar\
    \ measure on a query-backed model (one row), or as a per-artifact contribution\
    \ column? KB 17 thresholds it as a single number (<0.5), implying scalar."
  entities:
  - museum
  - memory:museum_kb_0
  query: null
  created_at: '1970-01-01T00:00:00Z'
