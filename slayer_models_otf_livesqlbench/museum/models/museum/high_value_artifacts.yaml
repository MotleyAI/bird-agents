version: 7
name: high_value_artifacts
source_queries:
- version: 3
  name: stage1
  source_model:
    name: stage1_src
    data_source: museum
    sql: WITH base AS (SELECT a.artref AS artref, MAX(a.insvalueusd) AS ins_value_usd,
      MAX(r.histsignrating) AS hist_sign_rating, MAX(r.cultscore) AS cult_score FROM
      artifactsecurityaccess a LEFT JOIN artifactratings r ON a.ratingref = r.ratingrecordregistry
      GROUP BY a.artref) SELECT artref, ins_value_usd, hist_sign_rating, cult_score,
      PERCENT_RANK() OVER (ORDER BY hist_sign_rating DESC) AS hist_pr, PERCENT_RANK()
      OVER (ORDER BY cult_score DESC) AS cult_pr FROM base
    columns:
    - name: artref
      sql: artref
      type: TEXT
    - name: ins_value_usd
      sql: ins_value_usd
      type: DOUBLE
    - name: hist_sign_rating
      sql: hist_sign_rating
      type: DOUBLE
    - name: cult_score
      sql: cult_score
      type: DOUBLE
    - name: hist_pr
      sql: hist_pr
      type: DOUBLE
    - name: cult_pr
      sql: cult_pr
      type: DOUBLE
  dimensions:
  - name: artref
  - name: ins_value_usd
  - name: hist_sign_rating
  - name: cult_score
  - name: hist_pr
  - name: cult_pr
  whole_periods_only: false
- version: 3
  name: final
  source_model:
    source_name: stage1
    columns:
    - name: is_high_value
      sql: CAST(CASE WHEN stage1.ins_value_usd > 1000000 OR (stage1.hist_pr <= 0.10
        AND stage1.cult_pr <= 0.10) THEN 1 ELSE 0 END AS INTEGER)
      type: INT
    - name: high_value_category
      sql: CASE WHEN stage1.ins_value_usd > 1000000 THEN 'Monetary High-Value' WHEN
        stage1.hist_pr <= 0.10 AND stage1.cult_pr <= 0.10 THEN 'Cultural/Historical
        High-Value' ELSE 'Other' END
      type: TEXT
      label: High-Value Category
      description: "[kb=51] An artifact falls into 'Monetary High-Value' category\
        \ when its InsValueUSD exceeds $1,000,000. It qualifies as 'Cultural/Historical\
        \ High-Value' when both its HistSignRating and CultScore are in the top 10%\
        \ of all artifacts (percentile rank = 1). Otherwise 'Other'. \u2014 Classification\
        \ system for categorizing high-value artifacts based on their monetary or\
        \ cultural/historical significance. [/kb=51] Note: in the museum dataset,\
        \ max InsValueUSD is ~$998K so the 'Monetary High-Value' bucket is empty in\
        \ current data. 'Top 10%' is operationalised as percent_rank <= 0.10 against\
        \ descending-rank columns hist_pr / cult_pr (where 0 = top), matching the\
        \ convention used by KB 11."
      meta:
        kb_id: 51
  dimensions:
  - name: artref
  - name: ins_value_usd
  - name: hist_sign_rating
  - name: cult_score
  - name: hist_pr
  - name: cult_pr
  - name: is_high_value
  - name: high_value_category
  whole_periods_only: false
query_variables: {}
backing_query_sql: "SELECT \"stage1.artref\" AS artref, \"stage1.ins_value_usd\" AS\
  \ ins_value_usd, \"stage1.hist_sign_rating\" AS hist_sign_rating, \"stage1.cult_score\"\
  \ AS cult_score, \"stage1.hist_pr\" AS hist_pr, \"stage1.cult_pr\" AS cult_pr, \"\
  stage1.is_high_value\" AS is_high_value, \"stage1.high_value_category\" AS high_value_category\
  \ FROM (SELECT\n  stage1.artref AS \"stage1.artref\",\n  stage1.ins_value_usd AS\
  \ \"stage1.ins_value_usd\",\n  stage1.hist_sign_rating AS \"stage1.hist_sign_rating\"\
  ,\n  stage1.cult_score AS \"stage1.cult_score\",\n  stage1.hist_pr AS \"stage1.hist_pr\"\
  ,\n  stage1.cult_pr AS \"stage1.cult_pr\",\n  CAST(CASE\n    WHEN stage1.ins_value_usd\
  \ > 1000000\n    OR (\n      stage1.hist_pr <= 0.10 AND stage1.cult_pr <= 0.10\n\
  \    )\n    THEN 1\n    ELSE 0\n  END AS INTEGER) AS \"stage1.is_high_value\",\n\
  \  CASE\n    WHEN stage1.ins_value_usd > 1000000\n    THEN 'Monetary High-Value'\n\
  \    WHEN stage1.hist_pr <= 0.10 AND stage1.cult_pr <= 0.10\n    THEN 'Cultural/Historical\
  \ High-Value'\n    ELSE 'Other'\n  END AS \"stage1.high_value_category\"\nFROM (\n\
  \  SELECT\n    \"stage1_src.artref\" AS artref,\n    \"stage1_src.ins_value_usd\"\
  \ AS ins_value_usd,\n    \"stage1_src.hist_sign_rating\" AS hist_sign_rating,\n\
  \    \"stage1_src.cult_score\" AS cult_score,\n    \"stage1_src.hist_pr\" AS hist_pr,\n\
  \    \"stage1_src.cult_pr\" AS cult_pr\n  FROM (\n    SELECT\n      stage1_src.artref\
  \ AS \"stage1_src.artref\",\n      stage1_src.ins_value_usd AS \"stage1_src.ins_value_usd\"\
  ,\n      stage1_src.hist_sign_rating AS \"stage1_src.hist_sign_rating\",\n     \
  \ stage1_src.cult_score AS \"stage1_src.cult_score\",\n      stage1_src.hist_pr\
  \ AS \"stage1_src.hist_pr\",\n      stage1_src.cult_pr AS \"stage1_src.cult_pr\"\
  \n    FROM (\n      WITH base AS (\n        SELECT\n          a.artref AS artref,\n\
  \          MAX(a.insvalueusd) AS ins_value_usd,\n          MAX(r.histsignrating)\
  \ AS hist_sign_rating,\n          MAX(r.cultscore) AS cult_score\n        FROM artifactsecurityaccess\
  \ AS a\n        LEFT JOIN artifactratings AS r\n          ON a.ratingref = r.ratingrecordregistry\n\
  \        GROUP BY\n          a.artref\n      )\n      SELECT\n        artref,\n\
  \        ins_value_usd,\n        hist_sign_rating,\n        cult_score,\n      \
  \  PERCENT_RANK() OVER (ORDER BY hist_sign_rating DESC) AS hist_pr,\n        PERCENT_RANK()\
  \ OVER (ORDER BY cult_score DESC) AS cult_pr\n      FROM base\n    ) AS stage1_src\n\
  \    GROUP BY\n      stage1_src.artref,\n      stage1_src.ins_value_usd,\n     \
  \ stage1_src.hist_sign_rating,\n      stage1_src.cult_score,\n      stage1_src.hist_pr,\n\
  \      stage1_src.cult_pr\n  ) AS _inner\n) AS stage1\nGROUP BY\n  stage1.artref,\n\
  \  stage1.ins_value_usd,\n  stage1.hist_sign_rating,\n  stage1.cult_score,\n  stage1.hist_pr,\n\
  \  stage1.cult_pr,\n  CAST(CASE\n    WHEN stage1.ins_value_usd > 1000000\n    OR\
  \ (\n      stage1.hist_pr <= 0.10 AND stage1.cult_pr <= 0.10\n    )\n    THEN 1\n\
  \    ELSE 0\n  END AS INTEGER),\n  CASE\n    WHEN stage1.ins_value_usd > 1000000\n\
  \    THEN 'Monetary High-Value'\n    WHEN stage1.hist_pr <= 0.10 AND stage1.cult_pr\
  \ <= 0.10\n    THEN 'Cultural/Historical High-Value'\n    ELSE 'Other'\n  END) AS\
  \ _inner"
