description: "[kb=11] An artifact is considered high-value when its InsValueUSD exceeds\
  \ $1,000,000 OR when both HistSignRating and CultScore are in the top 10% of all\
  \ artifacts. \u2014 Identifies artifacts with exceptional historical, cultural,\
  \ or monetary value requiring special attention. [/kb=11]\n\nOne row per artifact\
  \ (keyed by artref) with the percentile-rank columns needed to evaluate KB 11. Includes\
  \ a derived column `is_high_value` that materialises the boolean. The \"top 10%\"\
  \ cutoff is interpreted as `percent_rank <= 0.10` (descending PERCENT_RANK over\
  \ all 951 artifacts; ties at the top all share rank 0)."
