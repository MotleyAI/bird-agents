- name: organic_material_vulnerability
  sql: CASE WHEN LOWER(TRIM(artifactscore.mattype)) IN ('wood', 'textile', 'paper')
    AND LOWER(TRIM(envsensitivity)) = 'high' THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=20] Artifacts with MatType='Wood', 'Textile', or 'Paper' AND EnvSensitivity='High'\
    \ require specialized environmental controls with narrower humidity and temperature\
    \ ranges than inorganic materials. \u2014 Identifies organic materials requiring\
    \ special environmental conditions. [/kb=20] Boolean (1/0) row-level flag on sensitivitydata;\
    \ references artifactscore.mattype via the artref->artregistry join."
  label: Organic Material Vulnerability
  hidden: false
  meta:
    kb_id: 20
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: erf
  sql: (env_sens_weight + light_sens_weight + temp_sens_weight + humid_sens_weight)
    / 4.0
  type: DOUBLE
  primary_key: false
  description: "[kb=2] ERF = \\frac{\\sum_{i \\in sensitivities} SensWeight_i}{|sensitivities|},\
    \ where sensitivities includes EnvSensitivity, LightSensitivity, TempSensitivity,\
    \ etc, with value mapping based on Sensitivity Weight Values. \u2014 Quantifies\
    \ the overall environmental risk to an artifact based on its sensitivities. [/kb=2]\
    \ Computed as the arithmetic mean of the four encoded sensitivity weights (env,\
    \ light, temp, humid) on this row; NULL propagates if any input weight is NULL."
  label: Environmental Risk Factor (ERF)
  hidden: false
  meta:
    kb_id: 2
  sampled: 1.0 .. 10.0
- name: dsd
  sql: 36.0 * (10 - light_sens_weight) * (10 - temp_sens_weight) * (10 - humid_sens_weight)
    / 1000.0
  type: DOUBLE
  primary_key: false
  description: "[kb=4] DSD = (BaseDuration \xD7 (10 - LightSensWeight) \xD7 (10 -\
    \ TempSensWeight) \xD7 (10 - HumidSensWeight)) / 1000, where BaseDuration=36 months,\
    \ and SensWeight uses Sensitivity Weight Values. \u2014 Calculates the recommended\
    \ maximum display duration for an artifact based on its sensitivities. [/kb=4]"
  label: Display Safety Duration (DSD)
  hidden: false
  meta:
    kb_id: 4
  sampled: 0.0 .. 26.244
