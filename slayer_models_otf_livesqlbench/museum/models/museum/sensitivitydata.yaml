- name: env_sens_weight
  sql: CASE LOWER(TRIM(envsensitivity)) WHEN 'low' THEN 1 WHEN 'medium' THEN 5 WHEN
    'high' THEN 10 ELSE NULL END
  type: INT
  primary_key: false
  description: "[kb=1] EnvSensitivity: Low=1, Medium=5, High=10; LightSensitivity:\
    \ Low=1, Medium=5, High=10; TempSensitivity: Low=1, Medium=5, High=10; HumiditySensitivity:\
    \ Low=1, Medium=5, High=10 \u2014 Numerical weights for sensitivity calculations\
    \ [/kb=1] Numeric weight for envsensitivity (Low=1, Medium=5, High=10); NULL for\
    \ any other value."
  label: Sensitivity Weight Values
  hidden: false
  meta:
    kb_id: 1
  sampled: 1 .. 10
