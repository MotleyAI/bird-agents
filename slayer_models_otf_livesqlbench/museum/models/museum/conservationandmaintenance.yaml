- name: conservation_emergency
  sql: CASE WHEN LOWER(TRIM(artifactscore.conservestatus)) = 'critical' AND LOWER(TRIM(treatpriority))
    = 'urgent' THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=12] A situation where an artifact has ConserveStatus='Critical'\
    \ AND a TreatPriority='Urgent'. \u2014 Identifies artifacts requiring immediate\
    \ conservation intervention. [/kb=12]"
  label: Conservation Emergency
  hidden: false
  meta:
    kb_id: 12
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: conservation_backlog_risk
  sql: (artifactratings.cpi * ((julianday('now') - julianday(conservationandmaintenance.lastcleaningdate))
    - conservationandmaintenance.cleanintervaldays)) / 100.0
  type: DOUBLE
  primary_key: false
  description: "Note: 'Days since LastCleaningDate' is interpreted as julianday('now')\
    \ - julianday(lastcleaningdate), so this metric is evaluated relative to the query's\
    \ wall-clock time. [kb=33] CBR = (CPI \xD7 (Days since LastCleaningDate - CleanIntervalDays))\
    \ \xF7 100, where CPI is the Conservation Priority Index. Higher values indicate\
    \ higher risk from delayed conservation. \u2014 Quantifies the risk associated\
    \ with delayed conservation treatments. [/kb=33]"
  label: Conservation Backlog Risk (CBR)
  hidden: false
  meta:
    kb_id: 33
  sampled: 0.0 .. 165.49957031045204
- name: critical_conservation_alert
  sql: CASE WHEN conservation_emergency = 1 AND artifactratings.avs > 8 THEN 1 ELSE
    0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=41] An artifact that meets both the Conservation Emergency criteria\
    \ AND has an AVS > 8. \u2014 Identifies artifacts in critical condition requiring\
    \ immediate intervention. [/kb=41]"
  label: Critical Conservation Alert
  hidden: false
  meta:
    kb_id: 41
  sampled: '0'
  sampled_values:
  - '0'
  distinct_count: 1
