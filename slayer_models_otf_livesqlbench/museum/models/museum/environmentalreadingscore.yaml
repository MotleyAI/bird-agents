  - '0'
  distinct_count: 2
- name: showcase_failure_risk
  sql: CASE WHEN sesr < 4 OR ((CASE WHEN LOWER(TRIM(showcases.sealcondition)) = 'poor'
    THEN 1 ELSE 0 END) + (CASE WHEN LOWER(TRIM(showcases.maintstatus)) = 'overdue'
    THEN 1 ELSE 0 END) + (CASE WHEN LOWER(TRIM(showcases.filterstatus)) = 'replace
    now' THEN 1 ELSE 0 END) + (CASE WHEN LOWER(TRIM(showcases.silicagelstatus)) =
    'replace now' THEN 1 ELSE 0 END)) >= 3 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=16] Occurs when SESR < 4 OR at least three of the following are\
    \ true: SealCondition='Poor', MaintStatus='Overdue', FilterStatus='Replace Now',\
    \ SilicaGelStatus='Replace Now'. \u2014 Identifies showcases at risk of failing\
    \ to maintain proper environmental conditions. [/kb=16] Row-level flag on environmentalreadingscore:\
    \ per-reading evaluation since SESR is per-reading (kb=5); references showcase\
    \ status columns via the showcaseref->showcasereg join."
  label: Showcase Failure Risk
  hidden: false
  meta:
    kb_id: 16
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
