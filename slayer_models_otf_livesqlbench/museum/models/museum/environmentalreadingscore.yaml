  hidden: false
  format:
    type: integer
  sampled: 0.01 .. 2
- name: relhumidity
  sql: relhumidity
  type: INT
  primary_key: false
  description: "Sample values fall in 45..54 (entirely within the KB's ideal 45-55%\
    \ band); the broader 30-65% and out-of-bound ranges described by the KB are not\
    \ observed in current data. [kb=28] Values typically range from 30-65%, with 45-55%\
    \ being ideal for mixed collections. Fluctuations greater than 5% within 24 hours\
    \ can cause dimensional changes in organic materials. Values below 30% risk embrittlement,\
    \ while above 65% risk mold growth. \u2014 Illustrates relative humidity readings\
    \ and their conservation implications. [/kb=28]"
  label: Relative Humidity (%)
  hidden: false
  format:
    type: integer
  meta:
    kb_id: 28
  sampled: 45 .. 54
