- name: readtimestamp
  sql: readtimestamp
  type: TIMESTAMP
  primary_key: false
  description: "[kb=54] Conservation Environment Chronology (CEC) \u2014 CEC involves\
    \ grouping readings (e.g., temperature, humidity, air pressure) by fixed time\
    \ intervals (such as by year) to discern patterns and inform conservation strategies.\
    \ A methodological approach used in museum conservation to segment environmental\
    \ monitoring data into chronological intervals. This approach enables curators\
    \ to identify seasonal trends, long-term shifts, and anomalies in environmental\
    \ conditions that can affect artifact stability and preservation. [/kb=54] TIMESTAMP\
    \ NOT NULL indicating the date and time the reading was recorded."
  label: Conservation Environment Chronology (CEC)
  hidden: false
  meta:
    kb_id: 54
