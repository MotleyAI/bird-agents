- name: sesr
  sql: 10 - (tempvar24h + humvar24h / 5.0 + showcases.leakrate) / 3.0
  type: DOUBLE
  primary_key: false
  description: "[kb=5] SESR = 10 - (TempVar24h + HumVar24h/5 + LeakRate) / 3, where\
    \ higher scores indicate more stable showcases \u2014 Measures how well a showcase\
    \ maintains stable environmental conditions. [/kb=5]"
  label: Showcase Environmental Stability Rating (SESR)
  hidden: false
  meta:
    kb_id: 5
  sampled: 8.92 .. 9.973333333333333
- name: environmental_instability_event
  sql: (tempvar24h > 1 OR humvar24h > 3)
  type: BOOLEAN
  primary_key: false
  description: "[kb=13] Occurs when TempVar24h > 1\xB0C OR HumVar24h > 3 within a\
    \ 24-hour period. \u2014 Identifies periods when showcase environmental conditions\
    \ fluctuate beyond acceptable parameters. [/kb=13]"
  label: Environmental Instability Event
  hidden: false
  meta:
    kb_id: 13
  sampled: 1, 0
