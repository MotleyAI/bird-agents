- name: tempc
  sql: tempc
  type: INT
  primary_key: false
  description: "Sample values are integers in the narrow range 18..21\xB0C \u2014\
    \ all observed readings sit inside the KB's 'ideal' band, so any threshold logic\
    \ that needs to detect failures (>30 or <10) or non-ideal readings (<18 or >22)\
    \ will see no positives in the current data. [kb=27] Values typically range from\
    \ 15-25\xB0C, with 18-22\xB0C being ideal for most collections. Fluctuations greater\
    \ than 2\xB0C within 24 hours can stress materials. Values outside 10-30\xB0C\
    \ indicate environmental control failure requiring immediate attention. \u2014\
    \ Illustrates temperature readings and their conservation implications. [/kb=27]"
  label: "Temperature (\xB0C)"
  hidden: false
  format:
    type: integer
  meta:
    kb_id: 27
  sampled: 18 .. 21
- name: tempvar24h
  sql: tempvar24h
  type: DOUBLE
