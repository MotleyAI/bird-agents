- name: airtightness
  sql: airtightness
  type: DOUBLE
  primary_key: false
  description: "Sample values are 90..100 (mean ~95), suggesting this column stores\
    \ an airtightness QUALITY SCORE (higher = better) rather than the air-changes-per-day\
    \ leakage rate the KB describes. The KB's 0.01..5.0 range is closer to `showcases.leakrate`\
    \ (sampled 0.01..0.5). Any downstream encoding that needs the KB-described scale\
    \ must define the mapping explicitly \u2014 the schema does not carry it. [kb=26]\
    \ Showcases.Airtightness \u2014 Illustrates showcase airtightness measurement.\
    \ A REAL value typically ranging from 0.01 (extremely airtight, less than 0.01\
    \ air changes per day) to 5.0 (poor airtightness, multiple air changes per day).\
    \ Museum-grade showcases typically maintain values below 0.1. [/kb=26]"
  label: Showcases.Airtightness
  hidden: false
  format:
    type: integer
  meta:
    kb_id: 26
  sampled: 90 .. 100
