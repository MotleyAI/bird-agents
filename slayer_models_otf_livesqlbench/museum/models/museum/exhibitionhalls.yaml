- name: visitor_impact_risk
  sql: (visitorcountdaily * CASE LOWER(TRIM(visitorflowrate)) WHEN 'low' THEN 1 WHEN
    'medium' THEN 3 WHEN 'high' THEN 5 END * visitordwellmin) / 1000.0
  type: DOUBLE
  primary_key: false
  description: "[kb=10] VIR = (VisitorCountDaily * VisitorFlowRate * VisitorDwellMin)\
    \ / 1000, where VisitorFlowRate is numerically mapped: Low=1, Medium=3, High=5\
    \ \u2014 Assesses the risk posed by visitor traffic to artifacts in exhibition\
    \ halls. [/kb=10]"
  label: Visitor Impact Risk (VIR)
  hidden: false
  meta:
    kb_id: 10
  sampled: 0.04 .. 140.795
