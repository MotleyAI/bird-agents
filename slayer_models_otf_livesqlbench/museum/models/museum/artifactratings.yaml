- name: cpi
  sql: ((histsignrating + researchvalrating + cultscore) * (10 - CASE LOWER(TRIM(artifactscore.conservestatus))
    WHEN 'excellent' THEN 1 WHEN 'good' THEN 3 WHEN 'fair' THEN 5 WHEN 'poor' THEN
    7 WHEN 'critical' THEN 10 END)) / 30.0
  type: DOUBLE
  primary_key: false
  description: "Note: cultscore actually ranges 1..100 in the data while histsignrating\
    \ and researchvalrating range 1..10; the KB formula sums them as-is without normalization,\
    \ so cultscore dominates the additive term. [kb=0] CPI = \\frac{(HistSignRating\
    \ + ResearchValRating + CultScore) \\times (10 - ConserveStatus)}{30}, where ConserveStatus\
    \ is numerically mapped: Excellent=1, Good=3, Fair=5, Poor=7, Critical=10 \u2014\
    \ Calculates the overall conservation priority for an artifact based on multiple\
    \ factors. [/kb=0]"
  label: Conservation Priority Index (CPI)
  hidden: false
  meta:
    kb_id: 0
  sampled: 0.0 .. 34.2
- name: dynasty_value_artifact
  sql: CASE WHEN LOWER(TRIM(artifactscore.artdynasty)) IN ('ming','han','tang') AND
    researchvalrating > 8 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=18] Artifacts from 'Ming', 'Han', or 'Tang' dynasties that also\
    \ have ResearchValRating > 8. \u2014 Identifies artifacts from historically significant\
    \ dynasties with higher research and cultural value. [/kb=18]"
  label: Dynasty Value Artifact
  hidden: false
  meta:
    kb_id: 18
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: conservation_priority_level
  sql: CASE WHEN cpi > 7 THEN 'High Priority' WHEN cpi > 4 THEN 'Medium Priority'
    WHEN cpi <= 4 THEN 'Low Priority' END
  type: TEXT
  primary_key: false
  description: "Sample CPI values range 0.0 .. 34.2, so most artifacts fall in 'High\
    \ Priority' (CPI > 7); the KB's bands are applied as-stated without rescaling.\
    \ [kb=56] 'High Priority': CPI > 7 (Artifacts requiring immediate conservation\
    \ attention); 'Medium Priority': 4 < CPI <= 7 (Artifacts needing monitoring and\
    \ planned conservation); 'Low Priority': CPI <= 4 (Artifacts in stable condition).\
    \ \u2014 Classifies artifacts into priority levels based on their CPI scores [/kb=56]"
  label: Conservation Priority Level
  hidden: false
  meta:
    kb_id: 56
  sampled: High Priority, Low Priority, Medium Priority
  sampled_values:
  - High Priority
  - Low Priority
  - Medium Priority
  distinct_count: 3
- name: avs
  sql: cpi * sensitivitydata.erf
  type: DOUBLE
  primary_key: false
  description: "[kb=3] AVS = CPI \\times ERF, \\text{where higher scores indicate\
    \ artifacts requiring more urgent attention} \u2014 Comprehensive score indicating\
    \ how vulnerable an artifact is based on its conservation priority and environmental\
    \ sensitivities. [/kb=3] Row-level product of cpi (this row) and sensitivitydata.erf\
    \ (joined 1:1 via artref); NULL propagates if either input is NULL."
  label: Artifact Vulnerability Score (AVS)
  hidden: false
  meta:
    kb_id: 3
  sampled: 0.0 .. 253.425
