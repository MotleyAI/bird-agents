- name: cdr
  sql: (100 - coolremainpct) / NULLIF(julianday('now') - julianday(refilllatest),
    0)
  type: DOUBLE
  primary_key: false
  description: "[kb=1] Coolant Depletion Rate (CDR) = (100 - CoolRemainPct) / (Current_Date\
    \ - RefillLatest) \u2014 Measures how quickly the coolant is being depleted. [/kb=1]"
  label: Coolant Depletion Rate (CDR)
  hidden: false
  meta:
    kb_id: 1
  sampled: 0.0002134743900680551 .. 0.17188027314870838
- name: coolant_critical
  sql: CASE WHEN cdr > 1 AND coolremainpct < 30 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=17] A condition where CDR > 1 and CoolRemainPct < 30 \u2014 Identifies\
    \ critical coolant conditions. [/kb=17]"
  label: Coolant Critical
  hidden: false
  meta:
    kb_id: 17
  sampled: '0'
  sampled_values:
  - '0'
  distinct_count: 1
- name: efficient_container
  sql: CASE WHEN vaccinedetails.ser > 0.8 AND sensordata.tss > 0.9 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=18] A container where SER > 0.8 and TSS > 0.9 \u2014 Identifies\
    \ efficiently utilized containers. [/kb=18]"
  label: Efficient Container
  hidden: false
  meta:
    kb_id: 18
- name: ces
  sql: vaccinedetails.ser * sensordata.cei * (1 - sensordata.cri)
  type: DOUBLE
  primary_key: false
  description: "[kb=36] CES = SER \\times CEI \\times (1 - CRI) \u2014 Overall container\
    \ efficiency considering multiple metrics. [/kb=36]"
  label: Container Efficiency Score (CES)
  hidden: false
  meta:
    kb_id: 36
- name: severe_container_risk
  sql: CASE WHEN container.ces < 0.3 AND sensordata.cei < 0.5 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=41] A container where CES < 0.3 and CEI < 0.5 \u2014 Identifies\
    \ containers with severe combined risks. [/kb=41]"
  label: Severe Container Risk
  hidden: false
  meta:
    kb_id: 41
measures:
- formula: rank(cdr:sum)
  name: depletion_rank
  label: Depletion Rank
  description: "[kb=62] Depletion Rank \u2014 Ranks containers based on the rate of\
    \ coolant depletion. Rank assigned to containers based on descending order of\
    \ CDR (rank 1 = highest CDR). [/kb=62]"
  meta:
    kb_id: 62
