  primary_key: false
  description: "[kb=5] SER = \\frac{VialTally \\times 10}{VolLiters} \u2014 Measures\
    \ how efficiently container volume is utilized. [/kb=5]"
  label: Storage Efficiency Ratio (SER)
  hidden: false
  meta:
    kb_id: 5
  sampled: 4.680851063829787 .. 1907.4
