- formula: rank(ser:sum)
  name: efficiency_rank
  label: Efficiency Rank
  description: "[kb=63] Efficiency Rank \u2014 Ranks containers based on their storage\
    \ efficiency. Rank assigned to containers based on descending order of SER (rank\
    \ 1 = highest SER). [/kb=63]"
