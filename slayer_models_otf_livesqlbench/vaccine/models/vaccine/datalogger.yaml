- name: lhi
  sql: (container.batterypct / 100.0) * (1 - (datalogger.memusepct / 100.0)) * (datalogger.datapct
    / 100.0)
  type: DOUBLE
  primary_key: false
  description: "[kb=6] LHI = \\frac{BatteryPct}{100} \\times (1 - \\frac{MemUsePct}{100})\
    \ \\times \\frac{DataPct}{100} \u2014 Overall health score for data logger. [/kb=6]"
  label: Logger Health Index (LHI)
  hidden: false
  meta:
    kb_id: 6
  sampled: 0.0 .. 0.8705663999999999
- name: logger_failure_risk
  sql: CASE WHEN lhi < 0.3 OR (container.batterypct < 20 AND LOWER(TRIM(container.pwrbackupflag))
    = 'not available') THEN 1 ELSE 0 END
  type: INT
  primary_key: false
  description: "[kb=15] A logger where LHI < 0.3 or (BatteryPct < 20 and PwrBackupFlag='Not\
    \ Available') \u2014 Identifies loggers at risk of failure. [/kb=15]"
  label: Logger Failure Risk
  hidden: false
  meta:
    kb_id: 15
  sampled: 0 .. 1
