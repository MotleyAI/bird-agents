  - '1'
  distinct_count: 2
- name: container_alert_status
  sql: CASE WHEN container.ces < 0.4 AND trs > 0.7 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=48] A status where CES < 0.4 and TRS > 0.7 \u2014 Identifies containers\
    \ requiring urgent attention. [/kb=48]"
  label: Container Alert Status
  hidden: false
  meta:
    kb_id: 48
measures:
- formula: rank(cri:sum)
  name: risk_rank
  label: Risk Rank
  description: "[kb=64] Risk Rank \u2014 Ranks containers based on their risk level.\
    \ Rank assigned to containers based on descending order of CRI (rank 1 = highest\
    \ CRI). [/kb=64]"
  meta:
    kb_id: 64
