- name: tss
  sql: (1 - tempdevcount / 100.0) * (1 - critevents / 10.0) * tempstabidx
  type: DOUBLE
  primary_key: false
  description: "[kb=0] TSS = (1 - TempDevCount/100) * (1 - CritEvents/10) * TempStabIdx\
    \ \u2014 Calculates the overall temperature stability of a container based on\
    \ deviations and critical events. [/kb=0]"
  label: Temperature Stability Score (TSS)
  hidden: false
  meta:
    kb_id: 0
  sampled: 0.36536500000000005 .. 1.0
- name: hqi
  sql: (1 - handleevents / 100.0) * (1 - critevents / 10.0)
  type: DOUBLE
  primary_key: false
  description: "[kb=8] HQI = (1 - \\frac{HandleEvents}{100}) \\times (1 - \\frac{CritEvents}{10})\
    \ \u2014 Measures quality of shipment handling. [/kb=8]"
  label: Handling Quality Index (HQI)
  hidden: false
  meta:
    kb_id: 8
  sampled: 0.4 .. 1.0
- name: tbs
  sql: ABS(tempnowc - storetempc) / NULLIF(temptolc, 0) * tempdevcount
  type: DOUBLE
  primary_key: false
  description: "[kb=9] TBS = |TempNowC - StoreTempC| / TempTolC * TempDevCount \u2014\
    \ Calculates severity of temperature breaches. [/kb=9]"
  label: Temperature Breach Severity (TBS)
  hidden: false
  meta:
    kb_id: 9
  sampled: 0.0 .. 112.39999999999998
- name: cri
  sql: (1 - tss) * (1 - container.coolremainpct / 100.0)
  type: DOUBLE
  primary_key: false
  description: "[kb=2] CRI = (1 - TSS) \\times (1 - \\frac{CoolRemainPct}{100}) \u2014\
    \ Calculates overall risk level for a container based on temperature stability\
    \ and coolant status. [/kb=2]"
  label: Container Risk Index (CRI)
  hidden: false
  meta:
    kb_id: 2
  sampled: 0.0 .. 0.5041650049999999
- name: stable_transport
  sql: CASE WHEN hqi > 0.9 AND tss > 0.8 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=14] Transport where HQI > 0.9 and TSS > 0.8 \u2014 Identifies\
    \ stable transport conditions. [/kb=14]"
  label: Stable Transport
  hidden: false
  meta:
    kb_id: 14
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: cei
  sql: tss * (container.coolremainpct / 100.0) * (1 - container.cdr / 20.0)
  type: DOUBLE
  primary_key: false
  description: "[kb=31] CEI = \\text{TSS} \\times \\frac{\\text{CoolRemainPct}}{100}\
    \ \\times (1 - \\frac{\\text{CDR}}{20}) \u2014 Measures how efficiently coolant\
    \ is maintaining temperature stability. [/kb=31]"
  label: Coolant Efficiency Index (CEI)
  hidden: false
  meta:
    kb_id: 31
  sampled: 0.07353475042534206 .. 0.9158183616920595
- name: temperature_alert
  sql: CASE WHEN tbs > 2.0 AND tempdevcount > 5 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=16] A condition where TBS > 2.0 and TempDevCount > 5 \u2014 Identifies\
    \ critical temperature conditions. [/kb=16]"
  label: Temperature Alert
  hidden: false
  meta:
    kb_id: 16
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: trs
  sql: cri * (1 - hqi) * (1 + tbs)
  type: DOUBLE
  primary_key: false
  description: "[kb=30] TRS = CRI \\times (1 - HQI) \\times (1 + TBS) \u2014 Combines\
    \ container risk and handling quality for overall risk assessment. [/kb=30]"
  label: Total Risk Score (TRS)
  hidden: false
  meta:
    kb_id: 30
  sampled: 0.0 .. 15.94469954299428
- name: esf
  sql: tss * (1 + tbs / 5.0) * cei * (1 + ABS(tempnowc - storetempc) / NULLIF(temptolc,
    0))
  type: DOUBLE
  primary_key: false
  description: "[kb=53] ESF = TSS * (1 + TBS/5) * CEI * (1 + |TempNowC - StoreTempC|\
    \ / TempTolC) \u2014 Quantifies combined environmental stressors on vaccine stability.\
    \ [/kb=53]"
  label: Environmental Stress Factor (ESF)
  hidden: false
  meta:
    kb_id: 53
  sampled: 0.04375468910926323 .. 89.4417142903699
- name: tsr_safety
  sql: (transportinfo.route_completion_percentage / 100.0) * (1 - sensordata.trs)
    * sensordata.hqi
  type: DOUBLE
  primary_key: false
  description: "[kb=35] TSR = \\frac{RCP}{100} \\times (1 - TRS) \\times HQI \u2014\
    \ Safety rating for transport considering multiple factors. [/kb=35]"
  label: Transport Safety Rating (TSR)
  hidden: false
  meta:
    kb_id: 35
  sampled: -5.271715884835221 .. 0.8883529270881044
- name: rrf
  sql: (1 - transportinfo.route_completion_percentage / 100.0) * sensordata.trs *
    (1 - sensordata.cei)
  type: DOUBLE
  primary_key: false
  description: "[kb=38] RRF = (1 - \\frac{RCP}{100}) \\times TRS \\times (1 - CEI)\
    \ \u2014 Comprehensive route risk assessment. [/kb=38]"
  label: Route Risk Factor (RRF)
  hidden: false
  meta:
    kb_id: 38
  sampled: 0.0 .. 10.027789882049396
- name: lpm
  sql: transportinfo.route_completion_percentage * (hqi / NULLIF(SQRT(1 + trs), 0))
  type: DOUBLE
  primary_key: false
  description: "[kb=54] LPM = RCP * HQI / sqrt(1 + TRS) \u2014 Evaluates overall logistics\
    \ efficiency with temporal considerations. [/kb=54]"
  label: Logistics Performance Metric (LPM)
  hidden: false
  meta:
    kb_id: 54
  sampled: 0.17555663302842847 .. 89.18407129467286
- name: critical_transport_condition
  sql: CASE WHEN tsr_safety < 0.4 AND trs > 0.6 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=40] A transport condition where TSR < 0.4 and TRS > 0.6 \u2014\
    \ Identifies critically unsafe transport conditions. [/kb=40]"
  label: Critical Transport Condition
  hidden: false
  meta:
    kb_id: 40
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: critical_route_status
  sql: CASE WHEN rrf > 0.8 AND tsr_safety < 0.3 THEN 1 ELSE 0 END
  type: BOOLEAN
  primary_key: false
  description: "[kb=43] A route where RRF > 0.8 and TSR < 0.3 \u2014 Identifies routes\
    \ with critical risk levels. [/kb=43]"
  label: Critical Route Status
  hidden: false
  meta:
    kb_id: 43
  sampled: 0, 1
  sampled_values:
  - '0'
  - '1'
  distinct_count: 2
- name: transport_safety_alert
  sql: (tsr_safety < 0.5) AND (rrf > 0.7)
  type: BOOLEAN
  primary_key: false
  description: "[kb=47] A condition where TSR < 0.5 and RRF > 0.7 \u2014 Identifies\
    \ unsafe transport conditions. [/kb=47]"
  label: Transport Safety Alert
  hidden: false
  meta:
    kb_id: 47
  sampled: 0, 1
  sampled_values:
