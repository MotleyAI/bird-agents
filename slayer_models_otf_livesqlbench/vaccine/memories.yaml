- version: 2
  id: vaccine_kb_10
  learning: "KB 10 \u2014 Container Health Status\n\nKB item (verbatim from vaccine_kb.jsonl):\n\
    id: 10\nknowledge: Container Health Status\ndescription: Classifies containers\
    \ based on overall risk and temperature stability\n  to prioritize immediate action\
    \ and monitor operational trends.\ndefinition: 'Four-level classification based\
    \ on CRI, TSS, and TBS:\n\n  - Critical: CRI > 0.6 OR current TSS < 0.4\n\n  -\
    \ Unstable: Average TSS < 0.4 OR maximum TBS > 1.5 over the past 1 year, and not\n\
    \  Critical\n\n  - Moderate: Average TSS >= 0.4 AND maximum TBS <= 1.5 over the\
    \ past 1 year, and\n  not Critical\n\n  - Stable: Average TSS >= 0.7 AND maximum\
    \ TBS <= 1.0 over the past 1 year, and not\n  Critical'\ntype: domain_knowledge\n\
    children_knowledge:\n- 0\n- 2\n- 9\n\n--- setup-encode: deferred ---\nambiguous\
    \ because: KB 10 classifies containers into Critical/Unstable/Moderate/Stable\
    \ using both 'current' row values (CRI, TSS) and time-windowed aggregates (avg\
    \ TSS, max TBS 'over the past 1 year'). Multiple operationalisation choices are\
    \ unpinned: (a) sensordata has no per-reading timestamp suitable for a 1-year\
    \ window \u2014 the only TIMESTAMP is `alerttime` (last alert event), and its\
    \ sampled range spans only ~24h (2025-02-18..2025-02-19), so 'past 1 year' has\
    \ no meaningful anchor; (b) 'current TSS' / 'CRI > 0.6' need a rule that picks\
    \ one sensordata row per container ('latest' by which column?), and there is no\
    \ obvious latest-row indicator (CRI sample max is 0.504, so the CRI>0.6 clause\
    \ would never fire \u2014 possibly fine, but reinforces that the grain is ambiguous);\
    \ (c) the Stable conditions (avg TSS>=0.7 AND max TBS<=1.0) are a strict subset\
    \ of the Moderate conditions (avg TSS>=0.4 AND max TBS<=1.5), so the classifier\
    \ needs an explicit precedence order (presumably Stable > Moderate, but the KB\
    \ does not say). Per the NO-GUESS rule, deferring rather than encoding stub thresholds/grain\
    \ choices.\nclarify:\n  - Which timestamp column anchors the 'past 1 year' window\
    \ for averaging TSS and taking max TBS? sensordata.alerttime only spans ~24h in\
    \ the data \u2014 is the window meant to be computed against a different column,\
    \ or against the full history of sensordata rows for each container regardless\
    \ of time?\n  - How is 'current TSS' and 'current CRI' defined per container?\
    \ sensordata has many rows per container \u2014 pick the row with the latest alerttime?\
    \ The max sensortrack? Aggregate across all rows (avg/last/max)?\n  - What is\
    \ the precedence order when a container satisfies both Stable and Moderate (Stable's\
    \ bounds are a strict subset of Moderate's)? Confirm the intended order is: Critical\
    \ first, then Stable, then Moderate, then Unstable (or the canonical order to\
    \ apply)?\n  - Should the classification be exposed on the `container` model (one\
    \ row per container) as a derived TEXT column, requiring a multi-stage query-backed\
    \ model since the inputs cross an aggregation boundary? Or on `sensordata` per-row\
    \ with the windowed aggregates computed per containlink?\n  - CRI sample values\
    \ max at ~0.504 \u2014 confirm the literal threshold 'CRI > 0.6' is correct (vs.\
    \ e.g. a typo for >0.06 or a different scale)?"
  entities:
  - vaccine
  - memory:vaccine_kb_0
  - memory:vaccine_kb_2
