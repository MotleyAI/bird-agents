    \ joins to container/shipments, sensordata joins to container/transportinfo, and\
    \ the schema does not expose reverse joins. The two only share containvac=containlink\
    \ \u2192 containregistry, which is a 1-to-many (batch \u2192 sensor readings)\
    \ relationship, so the KB does not pin (a) which host model owns VVP, (b) how\
    \ to aggregate multiple TSS readings per vaccine batch (latest? avg? max?), or\
    \ (c) whether a new ModelJoin should be declared at all.\nclarify:\n  - What is\
