[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bird-interact-agents"
version = "0.1.0"
description = "Pluggable agent benchmarks for BIRD-Interact (SLayer + raw SQL modes)"
requires-python = ">=3.11,<4.0"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "litellm>=1.0",
    "anthropic>=0.40",
    # DEV-1478: agent.py imports sqlglot at module load for the literal-
    # existence pre-save validator. Also used by sar_audit/compare.py. A
    # runtime install of the `pydantic-ai` / `slayer` extras MUST resolve
    # `import bird_interact_agents...` without dev extras present.
    "sqlglot",
    # DEV-1521: autopsy.py imports yaml at module load; claude_sdk_otf*
    # agents import autopsy unconditionally, so pyyaml must be available
    # in the base install (not just in the cloud/all extras).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
claude-sdk = ["claude-agent-sdk>=0.1.68"]
pydantic-ai = [
    "pydantic-ai>=1.0",
    "httpx[socks]",
]
smolagents = ["smolagents>=1.0"]
agno = ["agno>=2.0"]
mcp-agent = ["mcp-agent>=0.0.16"]
slayer = ["motley-slayer[advanced-search]>=0.9.1"]
# `original` brings in the upstream BIRD-Interact mini_interact_agent harness
# so we can call its main.py directly via `uv run python -m batch_run_bird_interact.main`.
original = ["mini-interact-agent"]
postgres = ["psycopg2-binary>=2.9"]
cloud = [
    "ray[default]>=2.30",
    "google-cloud-storage>=2.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
]
all = [
    "claude-agent-sdk>=0.1.68",
    "pydantic-ai>=1.0",
    "smolagents>=1.0",
    "agno>=2.0",
    "mcp-agent>=0.0.16",
    "motley-slayer[advanced-search]>=0.9.1",
    "mini-interact-agent",
    "ray[default]>=2.30",
    "google-cloud-storage>=2.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "openai",   # used by SAR-audit tests' OpenAI-not-instantiated guard
]
# Notebook tooling for the analysis notebooks under `notebooks/` (e.g.
# query_syntax_rejections.ipynb). Kept out of `all` so cloud/runtime installs
# stay lean — only needed to (re)run the human-readable analysis notebooks.
analysis = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "nbconvert>=7.0",
]

# Upstream `mini-interact-agent` harness, installed from the MotleyAI fork
# (pinned to a sha so installs are reproducible). Only resolved when the
# `original` or `all` extras are requested. Replaces the previous sibling
# `../BIRD-Interact/` editable-path install so worktrees work without setup.
[tool.uv.sources]
mini-interact-agent = { git = "https://github.com/MotleyAI/BIRD-Interact.git", subdirectory = "mini_interact/knowledge_based/mini_interact_agent", rev = "6b897950780d123c8e8057d15f7d3f1b92819962" }

[project.scripts]
bird-interact = "bird_interact_agents.run:main"
bird-interact-cloud = "bird_interact_agents.cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bird_interact_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The default run excludes `integration` tests — those spawn real subprocesses
# (the `slayer` CLI ingest, the compare-results script) and dominate wall-time
# (~130s of a ~200s suite). Run them with `pytest -m integration`, or run
# everything with `pytest -o addopts=""`.
addopts = "-m 'not integration'"
markers = [
    "integration: spawns real subprocesses / hits external resources (slow); excluded from the default run.",
]
