- name: propfinancialdata__mortgagebits__mortbalance
  sql: JSON_EXTRACT(propfinancialdata, '$.mortgagebits.mortbalance')
  type: DOUBLE
  primary_key: false
  description: A DECIMAL(15,2) storing current mortgage balance (e.g., '150000.00').
