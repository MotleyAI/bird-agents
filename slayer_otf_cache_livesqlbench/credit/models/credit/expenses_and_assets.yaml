- name: propfinancialdata__propown
  sql: JSON_EXTRACT(propfinancialdata, '$.propown')
  type: TEXT
  primary_key: false
  description: An enum (PropertyOwnership_enum) describing property ownership (Rent,
    Living with Parents, Own).
  label: Propown
  hidden: false
  meta:
    derived_from:
      json_col: propfinancialdata
      path:
      - propown
- name: propfinancialdata__proptype
  sql: JSON_EXTRACT(propfinancialdata, '$.proptype')
  type: TEXT
  primary_key: false
  description: An enum (PropertyType_enum) for property classification (Apartment,
    House, Condo).
  label: Proptype
  hidden: false
  meta:
    derived_from:
      json_col: propfinancialdata
      path:
      - proptype
- name: propfinancialdata__propvalue
  sql: JSON_EXTRACT(propfinancialdata, '$.propvalue')
  type: DOUBLE
  primary_key: false
  description: A DECIMAL(15,2) property value (e.g., '250000.00').
  label: Propvalue
  hidden: false
  meta:
    derived_from:
