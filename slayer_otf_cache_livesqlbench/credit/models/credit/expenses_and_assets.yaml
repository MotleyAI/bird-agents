  hidden: false
  meta:
    derived_from:
      json_col: propfinancialdata
      path:
      - mortgagebits
      - mortpayhist
- name: propfinancialdata__rentpayhist
  sql: JSON_EXTRACT(propfinancialdata, '$.rentpayhist')
  type: TEXT
  primary_key: false
