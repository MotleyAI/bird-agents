- name: support_and_resources__support_services
  sql: JSON_EXTRACT(support_and_resources, '$.support_services')
  type: TEXT
  primary_key: false
  description: A VARCHAR(200) listing available or recommended support services (e.g.,
    'Peer support group, vocational rehab').
  label: Support Services
  hidden: false
  meta:
    derived_from:
      json_col: support_and_resources
      path:
      - support_services
- name: support_and_resources__community_resources
  sql: JSON_EXTRACT(support_and_resources, '$.community_resources')
  type: TEXT
  primary_key: false
  description: An enum (communityresources_enum) describing local resource availability
    (Limited, Comprehensive, Adequate).
  label: Community Resources
  hidden: false
  meta:
    derived_from:
