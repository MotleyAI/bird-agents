  hidden: false
- name: rsource
  sql: rsource
  type: TEXT
  primary_key: false
  description: An enum (referralsource_enum) for how the patient was referred (Self,
    Court, Physician, Emergency, Family).
  hidden: false
  sampled: Emergency, Court, Physician, Family, Self
  sampled_values:
  - Emergency
  - Court
  - Physician
  - Family
  - Self
  distinct_count: 5
