  id: mental_kb_6
  learning: "KB 6 \u2014 Patient Functional Impairment Score (PFIS)\n\nKB item (verbatim\
    \ from mental_kb.jsonl):\nid: 6\nknowledge: Patient Functional Impairment Score\
    \ (PFIS)\ndescription: Calculates an average functional impairment score across\
    \ patients.\ndefinition: PFIS = \\frac{\\sum_{i \\in assessmentsocialanddiagnosis}\
    \ funcimp\\_score_i}\n  {|assessmentsocialanddiagnosis|}, \\text{where } funcimp\\\
    _score = \\begin{cases} 3\n  & \\text{if } funcimp = Severe \\\\ 2 & \\text{if\
    \ } funcimp = Moderate \\\\ 1 & \\text{if\n  } funcimp = Mild \\end{cases}\ntype:\
    \ calculation_knowledge\nchildren_knowledge: -1"
  entities:
  - mental
  query: null
  created_at: *id001
