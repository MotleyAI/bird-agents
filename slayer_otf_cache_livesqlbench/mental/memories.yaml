  learning: "KB 0 \u2014 Average PHQ-9 Score by Facility (APSF)\n\nKB item (verbatim\
    \ from mental_kb.jsonl):\nid: 0\nknowledge: Average PHQ-9 Score by Facility (APSF)\n\
    description: Calculates the average PHQ-9 depression score for patients assessed\
    \ at\n  a specific facility.\ndefinition: APSF = \\frac{\\sum_{i \\in assessmentsymptomsandrisk}\
    \ (mental\\_health\\_scores_i['depression']['phq9\\_score'])}\n  {|assessmentsymptomsandrisk|}\n\
    type: calculation_knowledge\nchildren_knowledge: -1"
  entities:
  - mental
  query: null
  created_at: &id001 1970-01-01 00:00:00+00:00
- version: 1
  id: mental_kb_1
  learning: "KB 1 \u2014 Average GAD-7 Score by Facility (AGSF)\n\nKB item (verbatim\
    \ from mental_kb.jsonl):\nid: 1\nknowledge: Average GAD-7 Score by Facility (AGSF)\n\
    description: Calculates the average GAD-7 anxiety score for patients assessed\
    \ at a\n  specific facility.\ndefinition: AGSF = \\frac{\\sum_{i \\in assessmentsymptomsandrisk}\
    \ (mental\\_health\\_scores_i['anxiety']['gad7\\_score'])}\n  {|assessmentsymptomsandrisk|},\
    \ \\text{where } mental\\_health\\_scores_i['anxiety']['gad7\\_score']\n  \\text{\
    \ is the GAD-7 score for each assessment in the assessmentsymptomsandrisk table,\n\
    \  linked to a facility via encounters.facid}\ntype: calculation_knowledge\nchildren_knowledge:\
    \ -1"
  entities:
  - mental
  query: null
  created_at: *id001
