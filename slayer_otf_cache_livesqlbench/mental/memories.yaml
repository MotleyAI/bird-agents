  learning: "KB 52 \u2014 Therapeutic Alliance & Engagement Score (TAES)\n\nKB item\
    \ (verbatim from mental_kb.jsonl):\nid: 52\nknowledge: Therapeutic Alliance &\
    \ Engagement Score (TAES)\ndescription: Computes a combined score reflecting both\
    \ the average clinician-reported\n  therapeutic alliance and the calculated therapy\
    \ engagement score for a facility.\ndefinition: TAES = \\frac{Average(theralliance\\\
    _score) + TES}{2}, \\text{where } theralliance\\_score\n  = \\begin{cases} 3 &\
    \ \\text{if } theralliance = Strong \\\\ 2 & \\text{if } theralliance\n  = Moderate\
    \ \\\\ 1 & \\text{if } theralliance = Weak \\\\ 0 & \\text{if } theralliance\n\
    \  = Poor \\end{cases}, \\text{averaged across treatmentoutcomes, combined with\
    \ Therapy\n  Engagement Score (TES)}.\ntype: calculation_knowledge\nchildren_knowledge:\n\
    - 4"
