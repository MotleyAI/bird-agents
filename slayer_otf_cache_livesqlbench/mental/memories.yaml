  learning: "KB 61 \u2014 Facility Performance Quadrant (FPQ)\n\nKB item (verbatim\
    \ from mental_kb.jsonl):\nid: 61\nknowledge: Facility Performance Quadrant (FPQ)\n\
    description: Categorizes facilities into performance quadrants based on their\
    \ Treatment\n  Adherence Rate and Patient Stability Metric relative to median\
    \ thresholds.\ndefinition: \"A facility is assigned to one of four quadrants:\
    \ 'High Adherence, High\\\n  \\ Stability' if TAR \\u2265 median_tar and PSM \\\
    u2265 median_psm; 'High Adherence,\\\n  \\ Low Stability' if TAR \\u2265 median_tar\
    \ and PSM < median_psm; 'Low Adherence,\\\n  \\ High Stability' if TAR < median_tar\
    \ and PSM \\u2265 median_psm; 'Low Adherence,\\\n  \\ Low Stability' if TAR <\
    \ median_tar and PSM < median_psm.\"\ntype: domain_knowledge\nchildren_knowledge:\n\
