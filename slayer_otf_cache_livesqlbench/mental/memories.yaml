    \ (funcimpv\\_score_i)}{|treatmentoutcomes|}\n  \\times TAR, \\text{where } funcimpv\\\
    _score = \\begin{cases} 3 & \\text{if } funcimpv\n  = Significant \\\\ 2 & \\\
    text{if } funcimpv = Moderate \\\\ 1 & \\text{if } funcimpv =\n  Minimal \\end{cases}\n\
    type: calculation_knowledge\nchildren_knowledge:\n- 2"
