  id: mental_kb_2
  learning: "KB 2 \u2014 Treatment Adherence Rate (TAR)\n\nKB item (verbatim from\
    \ mental_kb.jsonl):\nid: 2\nknowledge: Treatment Adherence Rate (TAR)\ndescription:\
    \ Measures the proportion of patients with high or medium treatment adherence\n\
    \  at a facility.\ndefinition: TAR = \\frac{|treatmentoutcomes \\text{ with }\
    \ txadh \\in \\{High, Medium\\}|}\n  {|treatmentoutcomes|}\ntype: calculation_knowledge\n\
    children_knowledge: -1"
  entities:
  - mental
  query: null
  created_at: *id001
- version: 1
  id: mental_kb_3
  learning: "KB 3 \u2014 Suicide Risk Prevalence (SRP)\n\nKB item (verbatim from mental_kb.jsonl):\n\
    id: 3\nknowledge: Suicide Risk Prevalence (SRP)\ndescription: Calculates the percentage\
    \ of assessments indicating high or severe suicide\n  risk at a facility.\ndefinition:\
    \ SRP = \\frac{|assessmentsymptomsandrisk \\text{ with } suicrisk \\in \\{High,\n\
    \  Severe\\}|} {|assessmentsymptomsandrisk|} \\times 100\ntype: calculation_knowledge\n\
    children_knowledge: -1"
  entities:
  - mental
  query: null
  created_at: *id001
- version: 1
  id: mental_kb_4
  learning: "KB 4 \u2014 Therapy Engagement Score (TES)\n\nKB item (verbatim from\
    \ mental_kb.jsonl):\nid: 4\nknowledge: Therapy Engagement Score (TES)\ndescription:\
    \ Computes an average engagement score across therapy sessions.\ndefinition: TES\
    \ = \\frac{\\sum_{i \\in treatmentbasics} (therapy\\_details_i['engagement\\_score'])}\n\
    \  {|treatmentbasics|}, \\text{where } engagement\\_score = \\begin{cases} 3 &\
    \ \\text{if\n  } therapy\\_details['engagement'] = High \\\\ 2 & \\text{if } therapy\\\
    _details['engagement']\n  = Medium \\\\ 1 & \\text{if } therapy\\_details['engagement']\
    \ = Low \\\\ 0 & \\text{if\n  } therapy\\_details['engagement'] = Non-compliant\
    \ \\end{cases}, \\text{and } therapy\\_details\n  \\text{ is the JSONB column\
    \ in the treatmentbasics table}\ntype: calculation_knowledge\nchildren_knowledge:\
    \ -1"
  entities:
  - mental
  query: null
  created_at: *id001
- version: 1
  id: mental_kb_5
  learning: "KB 5 \u2014 Facility Resource Adequacy Index (FRAI)\n\nKB item (verbatim\
    \ from mental_kb.jsonl):\nid: 5\nknowledge: Facility Resource Adequacy Index (FRAI)\n\
    description: Quantifies the adequacy of community resources available at a facility.\n\
    definition: FRAI = \\frac{\\sum_{i \\in facilities} resource\\_score_i} {|facilities|},\n\
    \  \\text{where } resource\\_score = \\begin{cases} 3 & \\text{if } support\\\
    _and\\_resources['community\\_resources']\n  = Comprehensive \\\\ 2 & \\text{if\
    \ } support\\_and\\_resources['community\\_resources']\n  = Adequate \\\\ 1 &\
    \ \\text{if } support\\_and\\_resources['community\\_resources'] = Limited\n \
    \ \\end{cases}, \\text{and } support\\_and\\_resources \\text{ is the JSONB column\
    \ in the\n  facilities table}\ntype: calculation_knowledge\nchildren_knowledge:\
    \ -1"
  entities:
  - mental
  query: null
  created_at: *id001
