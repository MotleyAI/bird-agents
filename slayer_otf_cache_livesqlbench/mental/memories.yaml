  learning: "KB 8 \u2014 Social Support Effectiveness (SSE)\n\nKB item (verbatim from\
    \ mental_kb.jsonl):\nid: 8\nknowledge: Social Support Effectiveness (SSE)\ndescription:\
    \ Evaluates the effectiveness of social support based on social support\n  level\
    \ and relationship quality.\ndefinition: SSE = \\frac{\\sum_{i \\in assessmentsocialanddiagnosis}\
    \ (socsup\\_score_i\n  + relqual\\_score_i)} {|assessmentsocialanddiagnosis|},\
    \ \\text{where } socsup\\_score\n  = \\begin{cases} 3 & \\text{if } socsup = Strong\
    \ \\\\ 2 & \\text{if } socsup = Moderate\n  \\\\ 1 & \\text{if } socsup = Limited\
    \ \\end{cases}, \\text{and } relqual\\_score = \\begin{cases}\n  3 & \\text{if\
    \ } relqual = Good \\\\ 2 & \\text{if } relqual = Fair \\\\ 1 & \\text{if }\n\
    \  relqual = Poor \\\\ 0 & \\text{if } relqual = Conflicted \\end{cases}\ntype:\
    \ calculation_knowledge\nchildren_knowledge: -1"
  entities:
  - mental
  query: null
  created_at: *id001
