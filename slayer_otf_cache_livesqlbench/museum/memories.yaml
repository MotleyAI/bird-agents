  id: museum_kb_9
  learning: "KB 9 \u2014 Conservation Budget Efficiency (CBE)\n\nKB item (verbatim\
    \ from museum_kb.jsonl):\nid: 9\nknowledge: Conservation Budget Efficiency (CBE)\n\
    description: Measures the efficiency of conservation budget allocation relative\
    \ to\n  artifact importance.\ndefinition: CBE = \\frac{\\sum_{i \\in artifacts}\
    \ (CPI_i \\times BudgetRatio_i)}{|artifacts|},\n  \\text{where BudgetRatio is\
    \ the proportion of total conservation budget allocated\n  to each artifact}\n\
    type: calculation_knowledge\nchildren_knowledge:\n- 0"
  entities:
