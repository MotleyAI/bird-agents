  learning: "KB 1 \u2014 Sensitivity Weight Values\n\nKB item (verbatim from museum_kb.jsonl):\n\
    id: 1\nknowledge: Sensitivity Weight Values\ndescription: Numerical weights for\
    \ sensitivity calculations\ndefinition: 'EnvSensitivity: Low=1, Medium=5, High=10;\
    \ LightSensitivity: Low=1, Medium=5,\n  High=10; TempSensitivity: Low=1, Medium=5,\
    \ High=10; HumiditySensitivity: Low=1,\n  Medium=5, High=10'\ntype: value_illustration\n\
    children_knowledge: -1"
  entities:
