- version: 1
  id: museum_kb_2
  learning: "KB 2 \u2014 Environmental Risk Factor (ERF)\n\nKB item (verbatim from\
    \ museum_kb.jsonl):\nid: 2\nknowledge: Environmental Risk Factor (ERF)\ndescription:\
    \ Quantifies the overall environmental risk to an artifact based on its\n  sensitivities.\n\
    definition: ERF = \\frac{\\sum_{i \\in sensitivities} SensWeight_i}{|sensitivities|},\n\
    \  \\text{where sensitivities includes EnvSensitivity, LightSensitivity, TempSensitivity,\n\
    \  etc, with value mapping based on Sensitivity Weight Values.}\ntype: calculation_knowledge\n\
    children_knowledge:\n- 1"
  entities:
  - museum
  - memory:museum_kb_1
  query: null
  created_at: *id001
- version: 1
  id: museum_kb_3
  learning: "KB 3 \u2014 Artifact Vulnerability Score (AVS)\n\nKB item (verbatim from\
    \ museum_kb.jsonl):\nid: 3\nknowledge: Artifact Vulnerability Score (AVS)\ndescription:\
    \ Comprehensive score indicating how vulnerable an artifact is based on\n  its\
    \ conservation priority and environmental sensitivities.\ndefinition: AVS = CPI\
    \ \\times ERF, \\text{where higher scores indicate artifacts requiring\n  more\
    \ urgent attention}\ntype: calculation_knowledge\nchildren_knowledge:\n- 0\n-\
    \ 2"
  entities:
  - museum
  - memory:museum_kb_0
  - memory:museum_kb_2
  query: null
  created_at: *id001
- version: 1
  id: museum_kb_4
  learning: "KB 4 \u2014 Display Safety Duration (DSD)\n\nKB item (verbatim from museum_kb.jsonl):\n\
    id: 4\nknowledge: Display Safety Duration (DSD)\ndescription: Calculates the recommended\
    \ maximum display duration for an artifact based\n  on its sensitivities.\ndefinition:\
    \ DSD = \\frac{BaseDuration \\times (10 - LightSensWeight) \\times (10 - TempSensWeight)\n\
    \  \\times (10 - HumidSensWeight)}{1000}, \\text{where BaseDuration=36 months,\
    \ and SensWeight\n  uses Sensitivity Weight Values.}\ntype: calculation_knowledge\n\
    children_knowledge:\n- 1"
  entities:
  - museum
  - memory:museum_kb_1
  query: null
  created_at: *id001
- version: 1
  id: museum_kb_5
  learning: "KB 5 \u2014 Showcase Environmental Stability Rating (SESR)\n\nKB item\
    \ (verbatim from museum_kb.jsonl):\nid: 5\nknowledge: Showcase Environmental Stability\
    \ Rating (SESR)\ndescription: Measures how well a showcase maintains stable environmental\
    \ conditions.\ndefinition: SESR = 10 - \\frac{(TempVar24h + \\frac{HumVar24h}{5}\
    \ + LeakRate)}{3}, \\text{where\n  higher scores indicate more stable showcases}\n\
    type: calculation_knowledge\nchildren_knowledge: -1"
  entities:
  - museum
  query: null
  created_at: *id001
- version: 1
  id: museum_kb_6
  learning: "KB 6 \u2014 Artifact Exhibition Compatibility (AEC)\n\nKB item (verbatim\
    \ from museum_kb.jsonl):\nid: 6\nknowledge: Artifact Exhibition Compatibility\
    \ (AEC)\ndescription: Determines how compatible an artifact is with its current\
    \ showcase environment.\ndefinition: AEC = 10 - |ERF - SESR|, \\text{where a score\
    \ closer to 10 indicates better\n  compatibility}\ntype: calculation_knowledge\n\
    children_knowledge:\n- 2\n- 5"
  entities:
  - museum
  - memory:museum_kb_2
  - memory:museum_kb_5
  query: null
  created_at: *id001
- version: 1
  id: museum_kb_7
  learning: "KB 7 \u2014 Material Deterioration Rate (MDR)\n\nKB item (verbatim from\
    \ museum_kb.jsonl):\nid: 7\nknowledge: Material Deterioration Rate (MDR)\ndescription:\
    \ Estimates the rate of material deterioration based on environmental factors.\n\
    definition: MDR = \\frac{ArtAgeYears \\times ERF \\times (RelHumidity - 50)^2\
    \ \\times\n  TempC}{100000}, \\text{where higher values indicate faster deterioration}\n\
    type: calculation_knowledge\nchildren_knowledge:\n- 2"
  entities:
  - museum
  - memory:museum_kb_2
  query: null
  created_at: *id001
