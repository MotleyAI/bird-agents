- version: 1
  id: museum_kb_0
  learning: "KB 0 \u2014 Conservation Priority Index (CPI)\n\nKB item (verbatim from\
    \ museum_kb.jsonl):\nid: 0\nknowledge: Conservation Priority Index (CPI)\ndescription:\
    \ Calculates the overall conservation priority for an artifact based on\n  multiple\
    \ factors.\ndefinition: 'CPI = \\frac{(HistSignRating + ResearchValRating + CultScore)\
    \ \\times (10\n  - ConserveStatus)}{30}, \\text{where ConserveStatus is numerically\
    \ mapped: Excellent=1,\n  Good=3, Fair=5, Poor=7, Critical=10}'\ntype: calculation_knowledge\n\
    children_knowledge: -1"
  entities:
  - museum
  query: null
  created_at: &id001 1970-01-01 00:00:00+00:00
